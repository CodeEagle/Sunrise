name: iOS

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

env:
  XCODE_PROJECT: Sunrise.xcodeproj
  SCHEME: Sunrise
  IOS_SIMULATOR: iPhone 17

jobs:
  build-test-screenshot:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode matching an installed iOS Simulator runtime
        run: |
          ls /Applications/ | grep Xcode || true
          xcrun simctl list runtimes | grep iOS || true

          # Walk Xcode_26.x newest-first (skipping betas) and pick the first
          # one whose iOS major.minor has a Simulator runtime installed on
          # this runner image — runners ship a sparse set (e.g. 26.1, 26.2,
          # 26.4 but not 26.5/26.0), so blindly selecting the newest Xcode
          # leaves builds without a usable Simulator destination.
          best=""
          installed=$(xcrun simctl list runtimes | grep iOS | sed -E 's/iOS ([0-9]+\.[0-9]+).*/\1/' | tr -d ' ')
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -V -r); do
            ver=$(echo "$candidate" | sed -E 's|.*Xcode_(26\.[0-9]+)(\..*)?\.app|\1|')
            if echo "$installed" | grep -qx "$ver"; then
              best="$candidate"
              break
            fi
          done
          if [ -z "$best" ]; then
            # Fallback: just take the newest Xcode 26 install we have.
            best=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -V -r | head -1)
          fi
          if [ -z "$best" ] && [ -d /Applications/Xcode.app ]; then
            best=/Applications/Xcode.app
          fi
          if [ -n "$best" ]; then
            echo "Selected: $best"
            sudo xcode-select -s "$best"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcparse (screenshot extractor)
        run: brew install chargepoint/xcparse/xcparse

      - name: Generate project
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ENTITLEMENTS_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/build.log

      - name: Run tests + capture screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$IOS_SIMULATOR,OS=latest" \
            -resultBundlePath logs/TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ENTITLEMENTS_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/test.log

      - name: Extract screenshots from xcresult
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d logs/TestResults.xcresult ]; then
            xcparse screenshots logs/TestResults.xcresult screenshots/ || echo "(no screenshots)"
            ls -la screenshots/ || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload build + test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: warn
