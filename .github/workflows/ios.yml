name: iOS

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

env:
  XCODE_PROJECT: Sunrise.xcodeproj
  SCHEME: Sunrise
  IOS_SIMULATOR: iPhone 17

jobs:
  build-test-screenshot:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications/ | grep Xcode || true
          # Prefer Xcode 26 (Liquid Glass / iOS 26 SDK); fall back to whatever
          # the runner ships if the explicit version is missing.
          for candidate in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcparse (screenshot extractor)
        run: brew install chargepoint/xcparse/xcparse

      - name: Generate project
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ENTITLEMENTS_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/build.log

      - name: Run tests + capture screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$IOS_SIMULATOR,OS=latest" \
            -resultBundlePath logs/TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            ENTITLEMENTS_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee logs/test.log

      - name: Extract screenshots from xcresult
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d logs/TestResults.xcresult ]; then
            xcparse screenshots logs/TestResults.xcresult screenshots/ || echo "(no screenshots)"
            ls -la screenshots/ || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload build + test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: warn
